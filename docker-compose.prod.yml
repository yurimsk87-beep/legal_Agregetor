# Production stack for pravopoisk.ru
# Run with:  docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# - caddy     terminates TLS (auto Let's Encrypt) and proxies to the app
# - app       Next.js standalone server (internal only, never published)
# - postgres  database (internal only, NOT exposed to the internet)
# - redis     present for future shared rate limiting (internal only)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.production
    environment:
      LEAD_ATTACHMENT_STORAGE_ROOT: /app/private/lead-attachments
    volumes:
      - ./public/uploads:/app/public/uploads
      - lead_attachments:/app/private/lead-attachments
    expose:
      - "3000"

  attachment-cleaner:
    image: alpine:3.20
    restart: unless-stopped
    command: /bin/sh -c 'while true; do find /attachments -type f -name "*.pdf" -mmin +43200 -delete; sleep 86400; done'
    volumes:
      - lead_attachments:/attachments

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  lead_attachments:

