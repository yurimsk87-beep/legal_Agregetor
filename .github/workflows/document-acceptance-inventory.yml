name: Document acceptance inventory

on:
  pull_request:
    paths:
      - "scripts/create-document-acceptance-matrix.ts"
      - "package.json"
      - ".github/workflows/document-acceptance-inventory.yml"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run audit:document-matrix
      - uses: actions/upload-artifact@v4
        with:
          name: document-acceptance-matrix
          path: docs/acceptance-generated/
