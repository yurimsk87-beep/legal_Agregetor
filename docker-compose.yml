services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legal_aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/legal_aggregator?schema=public
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      REDIS_URL: redis://redis:6379
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      NEXT_PUBLIC_PLATFORM_NAME: ${NEXT_PUBLIC_PLATFORM_NAME:-ПравоПоиск}
      PLATFORM_LEGAL_NAME: ${PLATFORM_LEGAL_NAME:-}
      PLATFORM_INN: ${PLATFORM_INN:-}
      PLATFORM_OGRN: ${PLATFORM_OGRN:-}
      NEXT_PUBLIC_PLATFORM_PHONE: ${NEXT_PUBLIC_PLATFORM_PHONE:-}
      NEXT_PUBLIC_PLATFORM_EMAIL: ${NEXT_PUBLIC_PLATFORM_EMAIL:-}
      NEXT_PUBLIC_PLATFORM_ADDRESS: ${NEXT_PUBLIC_PLATFORM_ADDRESS:-}
      NEXT_PUBLIC_PLATFORM_WORK_HOURS: ${NEXT_PUBLIC_PLATFORM_WORK_HOURS:-Ежедневно с 9:00 до 21:00 по московскому времени}
      NEXT_PUBLIC_PLATFORM_REGIONS: ${NEXT_PUBLIC_PLATFORM_REGIONS:-Вся Россия}
      NEXT_PUBLIC_YANDEX_REGION: ${NEXT_PUBLIC_YANDEX_REGION:-Россия}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      LEAD_ATTACHMENT_STORAGE_ROOT: /app/private/lead-attachments
    volumes:
      - ./public/uploads:/app/public/uploads
      - lead_attachments:/app/private/lead-attachments
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  lead_attachments:

